[project]
name = "wheelpad-lab"
version = "0.1.0"
description = "Circular touchpad scrolling for Panasonic Lets Note on Linux"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "evdev>=2.0.0",
    "numpy>=2.5.3",
]

[project.scripts]
wheelpad-lab = "wheelpad_lab:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
