# Keep the standard Ctrl+b prefix.
set -g default-terminal 'tmux-256color'
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g set-clipboard external
set -g status-style 'bg=colour235,fg=colour250'
set -g status-left '#[fg=colour81,bold] #S #[default]'
set -g status-right '#[fg=colour244]%Y-%m-%d %H:%M '
setw -g window-status-current-style 'fg=colour81,bold'
set -g status-left-length 30
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind r source-file ~/.tmux.conf \; display-message 'tmux configuration reloaded'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# Wayland clipboard when available; console copy mode still works without it.
if-shell 'test -n "$WAYLAND_DISPLAY" && command -v wl-copy >/dev/null 2>&1' 'bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"'
set -ag update-environment ' WAYLAND_DISPLAY XDG_CURRENT_DESKTOP'
